name: Deploy to Render

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Deploy to Render
      uses: johnbeynon/render-deploy-action@v0.0.8
      with:
        service-id: ${{ secrets.RENDER_SERVICE_ID }}
        api-key: ${{ secrets.RENDER_API_KEY }}
        
    - name: Wait for deployment
      run: |
        echo "Deployment triggered. Check Render dashboard for status."
        echo "Your API will be available at: https://${{ secrets.RENDER_SERVICE_NAME }}.onrender.com"
        
    - name: Test deployment
      run: |
        sleep 60  # Wait for deployment to complete
        curl -f https://${{ secrets.RENDER_SERVICE_NAME }}.onrender.com/health || echo "Health check failed - service may still be starting"