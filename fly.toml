# Fly.io deployment configuration
app = "aircall-agent"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

[http_service.checks]
  grace_period = "5s"
  interval = "10s"
  method = "GET"
  path = "/health"
  timeout = "2s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"

[env]
  HOST = "0.0.0.0"
  PORT = "8000"